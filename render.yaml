services:
  - type: web
    name: datapilot-ai-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/system/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: datapilot-ai-postgres
          property: connectionString
      - key: LLM_PROVIDER
        value: mock
      - key: APP_ENV
        value: production
      - key: AUTO_SEED_DATASETS
        value: "1"
      - key: MAX_AGENT_STEPS
        value: 12
databases:
  - name: datapilot-ai-postgres
    databaseName: datapilot
    plan: free
